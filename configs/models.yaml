# Versioned description of the frozen final system (Phase 8) and its components.
# The encoder is downloaded from the Hugging Face Hub; pin the revision so a fresh setup gets identical weights.
# scripts/reproduce.py --verify checks the downloaded weights against the SHA-256 below.

encoder:
  name: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41      # HF commit used in every phase
  weights_file: model.safetensors
  weights_sha256: from artifacts/phase8/freeze_manifest.json (encoder.model.safetensors_sha256)

final_system:
  description: MiniLM -> Phase 3 MLP head -> spaCy-free constraint features -> Phase 6 HistGradientBoosting meta-model -> global threshold
  base_head: artifacts/phase3/sbert_all-MiniLM-L6-v2/mlp.pt
  base_head_config: artifacts/phase3/sbert_all-MiniLM-L6-v2/mlp_config.json
  meta_model: artifacts/phase6/meta_model.joblib          # bundle: model, variant, threshold, uses_spacy=False
  threshold_policy: artifacts/phase7/frozen_policy_final.json   # global tau = 0.35
  feature_config: artifacts/feature_config.json           # generated by scripts/build_registry.py

baseline_system:
  model: artifacts/phase3/sbert_all-MiniLM-L6-v2/mlp.pt
  threshold_policy: artifacts/phase7/frozen_policy_baseline.json  # global tau = 0.32

context_only:
  cluster_centroids: artifacts/phase4/cluster_model/centroids.npy  # 12 frozen K-Means centroids (not used for decisions)
  cluster_names: artifacts/phase4/cluster_names.json

input_canonicalisation:
  base_probability: cast to float32 before logit (src/models/meta.py::base_logit)
  meta_features: rounded to 6 decimals inside MetaModel.design()
  embeddings: rounded through float16 (matches the on-disk cache used for training/evaluation)
